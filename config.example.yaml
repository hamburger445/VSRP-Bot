info_panel:
  title: "Community Information"
  description: |
    Welcome to the server. Use the buttons below to quickly access important information about our community, departments, and roleplay resources.

    **Getting Started**
    Before participating in roleplay, please read through the Rules and Penal Code. These resources explain our expectations, roleplay standards, and community guidelines.

    **Community Resources**
    Use the navigation buttons below to learn more about our departments, frequently asked questions, and other important server information.
  footer: "Thank you for being a member of our community."
  color: 3447003
  sections:
    server_information:
      title: "Server Information"
      content: |
        Welcome to Wythe County Roleplay. Please read and review the resources below before participating in roleplay.

        **Server Rules**
        Read the server rules here: https://docs.google.com/document/d/1SNq1WUZRn_z9iZOY-BpU6uxch1HVXJjj/edit?usp=sharing&ouid=104985960847666677165&rtpof=true&sd=true

        **Penal Codes**
        Review the penal codes here: https://docs.google.com/spreadsheets/d/1L4mvKC6ir5J5bYgoIgD5H9J-Il_0czwI/edit?usp=sharing&ouid=104985960847666677165&rtpof=true&sd=true
      button_label: "Server Information"
    departments:
      title: "Departments"
      content: |
        Explore the main roleplay departments and how to connect with department staff.

        **Wythe County Sheriffs Office**
        **Wythe County Fire & Rescue**
        **EMS and dispatch resources**
      button_label: "Departments"
    rules:
      title: "Server Rules"
      content: |
        Review the complete server rules covering conduct, roleplay expectations, and community standards.
      url: https://docs.google.com/document/d/1SNq1WUZRn_z9iZOY-BpU6uxch1HVXJjj/edit?usp=sharing&ouid=104985960847666677165&rtpof=true&sd=true
      button_label: "Rules"
    penal_code:
      title: "Penal Code"
      content: |
        Access the penal code document to understand offenses, consequences, and roleplay expectations.
      url: https://docs.google.com/spreadsheets/d/1L4mvKC6ir5J5bYgoIgD5H9J-Il_0czwI/edit?usp=sharing&ouid=104985960847666677165&rtpof=true&sd=true
      button_label: "Penal Code"
    faq:
      title: "Frequently Asked Questions"
      content: |
        Find answers to common roleplay questions, server procedures, and onboarding guidance.
        If you still need help, open a support ticket through the ticket panel.
      button_label: "FAQ"
    applications:
      title: "Civilian Applications"
      content: |
        Ready to apply for civilian roles? Use `/apply` or ask staff to post the application panel.
        Applications are completed through direct messages and are reviewed by staff.
      button_label: "Applications"

department_pings:
  events:
    fire_spawn:
      label: "FD Emergency Call"
      departments: [fire1, fire2, fire3]
      message: "An emergency call has been received requesting fire department assistance. Fire personnel are requested to respond and handle the incident as appropriate."

    robbery:
      label: "PD Emergency Call"
      departments: [police1, police2]
      message: "An emergency call has been received requesting law enforcement assistance. Police units are requested to respond and handle the incident as appropriate."

    medical:
      label: "Medical Emergency"
      departments: [ems]
      message: "A medical emergency has been reported. EMS personnel are requested to respond, assess the patient, and provide the appropriate level of care."

    traffic:
      label: "Traffic Incident"
      departments: [dot]
      message: "A traffic incident has been reported. DOT personnel are requested to respond and assist with traffic control, roadway hazards, and scene management as needed."

