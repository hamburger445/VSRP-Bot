# Discord bot + citation/warrant editor (not CAD).
services:
  - type: web
    name: vsrp-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_DATABASE
        value: github
      - key: DISCORD_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: FORM_SECRET
        sync: false
      - key: GITHUB_REPO
        value: hamburger445/VSRP-Bot
      - key: GITHUB_DB_PATH
        value: data/cad/db.json
      - key: GITHUB_DB_BRANCH
        value: cad-data
