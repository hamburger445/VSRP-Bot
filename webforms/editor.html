<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VSRP Document Editor</title>
  <style>
    :root { --ink:#1a1a1a; --paper:#f6f1e4; --rule:#5a4a32; --bg:#1c1c1c; --panel:#2a2a2a; --muted:#8a8074; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:#eee; font-family: Georgia, "Times New Roman", serif; }
    .shell { display:grid; grid-template-columns: minmax(320px, 42%) 1fr; min-height:100%; }
    header.bar { grid-column:1/-1; display:flex; gap:12px; align-items:center; padding:10px 16px; background:#111; border-bottom:1px solid #333; }
    header.bar h1 { font-size:15px; letter-spacing:.12em; margin:0; }
    header.bar .status { margin-left:auto; font-size:12px; color:var(--muted); }
    .form-pane { background:var(--panel); padding:16px 18px 48px; overflow:auto; border-right:1px solid #111; }
    .preview-pane { overflow:auto; padding:20px; background:#2b2b2b; }
    label { display:flex; flex-direction:column; gap:4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#cfc6b8; margin-bottom:10px; }
    input, select, textarea { font: 15px/1.35 Georgia, serif; padding:8px; border:1px solid #555; background:#1a1a1a; color:#f4efdf; width:100%; }
    textarea { min-height:72px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button.act { width:100%; margin-top:8px; padding:11px; font-weight:700; border:0; cursor:pointer; font-family:inherit; }
    .primary { background:#f4efdf; color:#111; }
    .ghost { background:transparent; color:#f4efdf; border:1px solid #888 !important; }
    .paper { background:var(--paper); color:var(--ink); max-width:720px; margin:0 auto 40px; padding:28px 32px 40px; min-height:900px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
    .paper h2 { text-align:center; letter-spacing:.1em; font-size:20px; margin:0 0 6px; }
    .paper .disclaimer { text-align:center; font-size:11px; font-style:italic; color:#5c5346; margin-bottom:16px; }
    .paper h3 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; border-bottom:1px solid var(--rule); margin:16px 0 8px; }
    .paper .line { margin:7px 0; font-size:14px; line-height:1.45; word-wrap:break-word; }
    .paper .line b { display:inline; }
    .checks { font-size:14px; }
    .err { color:#f4b4b4; font-size:13px; }
    .ok { color:#b6e2c1; }
    @media (max-width: 900px) { .shell { grid-template-columns:1fr; } .form-pane { max-height:48vh; } .row { grid-template-columns:1fr; } }
    @media print { header.bar, .form-pane { display:none !important; } .shell { display:block; } .preview-pane { padding:0; background:#fff; } .paper { box-shadow:none; margin:0; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar">
      <h1>VSRP DOCUMENT EDITOR</h1>
      <select id="kind"></select>
      <span class="status" id="status">Loading…</span>
    </header>
    <section class="form-pane" id="fields"></section>
    <section class="preview-pane"><div class="paper" id="preview"></div></section>
  </div>
<script>
const TOKEN = {{TOKEN_JSON}};
const LOCKED = {{KIND_JSON}};
const KINDS = [
  {id:"citation", label:"Virginia Uniform Summons"},
  {id:"warrant", label:"Warrant of Arrest / Search"},
  {id:"serve", label:"Served Warrant"},
];
let boot = {officer:"", subject:"", agencies:[], warrants:[], draft:{}};
const $ = (id) => document.getElementById(id);
function val(name, fallback="") {
  const el = document.querySelector(`[name="${name}"]`);
  if (!el) return fallback;
  if (el.type === "checkbox") return el.checked;
  return el.value;
}
function kind() { return $("kind").value; }
function formData() {
  const data = {};
  document.querySelectorAll("#fields [name]").forEach(el => {
    data[el.name] = el.type === "checkbox" ? el.checked : el.value;
  });
  data.kind = kind();
  return data;
}
function citationFields() {
  const ag = (boot.agencies||[]).map(a => `<option ${a===boot.agency?"selected":""}>${esc(a)}</option>`).join("");
  return `
    <label>Agency <select name="agency">${ag}</select></label>
    <div class="row">
      <label>County <input name="county" value="WYTHE"></label>
      <label>Court type <select name="court_type">
        <option>General District Court (Traffic)</option>
        <option>General District Court (Criminal)</option>
        <option>Juvenile &amp; Domestic Relations District Court</option>
      </select></label>
    </div>
    <div class="row">
      <label>Month <input name="court_month" required></label>
      <label>Day <input name="court_day" required></label>
    </div>
    <div class="row">
      <label>Year <input name="court_year" value="2026"></label>
      <label>Time <input name="court_time" placeholder="10:30"></label>
    </div>
    <label>AM / PM <select name="am_pm"><option>AM</option><option>PM</option></select></label>
    <div class="row">
      <label>VA Code <input name="va_code" required></label>
      <label>Local code <input name="local_code"></label>
    </div>
    <label>Describe charge <textarea name="charge_description" required></textarea></label>
    <label>Fine ($) <input name="fine" value="0"></label>
    <div class="row">
      <label>Commercial motor vehicle <select name="commercial_motor_vehicle"><option>No</option><option>Yes</option></select></label>
      <label>Hazardous materials <select name="hazardous_materials"><option>No</option><option>Yes</option></select></label>
    </div>
    <div class="row">
      <label>Resulted in fatality <select name="resulted_in_fatality"><option>No</option><option>Yes</option></select></label>
      <label>Highway safety corridor <select name="highway_safety_corridor"><option>No</option><option>Yes</option></select></label>
    </div>
    <label>Issued by <input name="issued_by" value="${esc(boot.officer||"")}"></label>`;
}
function warrantFields() {
  return `
    <div class="row">
      <label>Warrant type <select name="warrant_type"><option>Arrest</option><option>Search</option></select></label>
      <label>Charge class <select name="charge_class"><option>Misdemeanor</option><option>Felony</option></select></label>
    </div>
    <div class="row">
      <label>Jurisdiction <select name="jurisdiction"><option>County</option><option>State</option></select></label>
      <label>County <input name="county" value="WYTHE"></label>
    </div>
    <label><input type="checkbox" name="court_general_district"> General district court</label>
    <label><input type="checkbox" name="court_criminal"> Criminal</label>
    <label><input type="checkbox" name="court_traffic"> Traffic</label>
    <label><input type="checkbox" name="court_jdr"> J&amp;DR district court</label>
    <div class="row">
      <label>VA Code <input name="va_code" required></label>
      <label>Code description <input name="code_description" required></label>
    </div>
    <label>Accused <input name="accused" value="${esc(boot.subject||"")}" required></label>
    <div class="row">
      <label>Sex <select name="sex"><option></option><option>M</option><option>F</option></select></label>
      <label>Race <select name="race"><option></option><option>White</option><option>Black</option><option>Hispanic</option><option>Asian</option><option>Native American</option><option>Other</option></select></label>
    </div>
    <div class="row">
      <label>Eyes <input name="eyes"></label>
      <label>Hair <input name="hair"></label>
    </div>
    <label>Date &amp; time issued <input name="issued_datetime"></label>`;
}
function serveFields() {
  const opts = (boot.warrants||[]).map(w => `<option value="${w.id}">#${esc(w.case_number||w.id)} — ${esc(w.reason||"")}</option>`).join("");
  return `
    <label>Active warrant <select name="warrant_id">${opts || "<option value=''>None on file</option>"}</select></label>
    <label>Arresting officer <input name="arresting_officer" value="${esc(boot.officer||"")}" required></label>
    <label>Badge no., agency &amp; jurisdiction <input name="badge_agency_jurisdiction" required></label>
    <label>Date &amp; time served <input name="served_datetime" required></label>`;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mark(v){ return v ? "X" : " "; }
function renderPreview() {
  const d = formData();
  const k = kind();
  let html = "";
  if (k === "citation") {
    html = `<h2>VIRGINIA UNIFORM SUMMONS</h2>
      <p class="disclaimer">Roleplay record. Not an official Commonwealth of Virginia form.</p>
      <h3>Agency</h3><div class="line"><b>Agency:</b> ${esc(d.agency)}</div>
      <h3>Court and jurisdiction</h3>
      <div class="line"><b>YOU ARE SUMMONED TO APPEAR IN THE COUNTY OF:</b> ${esc(d.county||"WYTHE")}</div>
      <div class="line"><b>Court type:</b> ${esc(d.court_type)}</div>
      <h3>Court appearance</h3>
      <div class="line"><b>ON:</b> ${esc(d.court_month)} ${esc(d.court_day)}, ${esc(d.court_year)}</div>
      <div class="line"><b>AT:</b> ${esc(d.court_time)} ${esc(d.am_pm)}</div>
      <h3>Charge information</h3>
      <div class="line"><b>VA CODE:</b> ${esc(d.va_code)}</div>
      <div class="line"><b>LOCAL CODE:</b> ${esc(d.local_code)}</div>
      <div class="line"><b>DESCRIBE CHARGE:</b> ${esc(d.charge_description)}</div>
      <div class="line"><b>FINE:</b> $${esc(d.fine||"0")}</div>
      <h3>Additional questions</h3>
      <div class="line">COMMERCIAL MOTOR VEHICLE: ${esc(d.commercial_motor_vehicle)}</div>
      <div class="line">HAZARDOUS MATERIALS: ${esc(d.hazardous_materials)}</div>
      <div class="line">RESULTED IN FATALITY: ${esc(d.resulted_in_fatality)}</div>
      <div class="line">HIGHWAY SAFETY CORRIDOR: ${esc(d.highway_safety_corridor)}</div>
      <h3>Issuing officer</h3>
      <div class="line"><b>ISSUED BY:</b> ${esc(d.issued_by)}</div>
      <div class="line"><b>SUBJECT:</b> ${esc(boot.subject)}</div>`;
  } else if (k === "warrant") {
    html = `<h2>WARRANT OF (${esc(d.warrant_type||"Arrest")}) — (${esc(d.charge_class||"Misdemeanor")}) (${esc(d.jurisdiction||"County")})</h2>
      <p class="disclaimer">Roleplay record. Not an official Commonwealth of Virginia form.</p>
      <h3>Jurisdiction and court</h3>
      <div class="line"><b>COUNTY OF:</b> ${esc(d.county||"WYTHE")}</div>
      <div class="line checks">GENERAL DISTRICT COURT: [${mark(d.court_general_district)}] &nbsp; CRIMINAL: [${mark(d.court_criminal)}]</div>
      <div class="line checks">TRAFFIC: [${mark(d.court_traffic)}] &nbsp; J&amp;DR: [${mark(d.court_jdr)}]</div>
      <h3>Offense information</h3>
      <div class="line"><b>CODE OF VIRGINIA:</b> ${esc(d.va_code)}</div>
      <div class="line"><b>CODE DESCRIPTION:</b> ${esc(d.code_description)}</div>
      <h3>Accused information</h3>
      <div class="line"><b>ACCUSED:</b> ${esc(d.accused)}</div>
      <div class="line"><b>SEX:</b> ${esc(d.sex)} &nbsp; <b>RACE:</b> ${esc(d.race)}</div>
      <div class="line"><b>EYES:</b> ${esc(d.eyes)} &nbsp; <b>HAIR:</b> ${esc(d.hair)}</div>
      <div class="line"><b>DISCORD SUBJECT:</b> ${esc(boot.subject)}</div>
      <h3>Issuance</h3>
      <div class="line"><b>DATE &amp; TIME ISSUED:</b> ${esc(d.issued_datetime)}</div>
      <div class="line"><b>ISSUED BY:</b> ${esc(boot.officer)}</div>`;
  } else {
    html = `<h2>SERVED WARRANT</h2>
      <p class="disclaimer">Roleplay record. Original issue date is not changed.</p>
      <div class="line"><b>SUBJECT:</b> ${esc(boot.subject)}</div>
      <div class="line"><b>ARRESTING OFFICER:</b> ${esc(d.arresting_officer)}</div>
      <div class="line"><b>BADGE NO., AGENCY, &amp; JURISDICTION:</b> ${esc(d.badge_agency_jurisdiction)}</div>
      <div class="line"><b>DATE &amp; TIME SERVED:</b> ${esc(d.served_datetime)}</div>`;
  }
  $("preview").innerHTML = html;
}
function paintFields() {
  const k = kind();
  $("fields").innerHTML = (k==="citation"?citationFields():k==="warrant"?warrantFields():serveFields()) +
    `<p class="err" id="err"></p>
     <button class="act primary" type="button" id="submit">Submit to Discord</button>
     <button class="act ghost" type="button" id="pdf">Download / print PDF</button>
     <button class="act ghost" type="button" id="print">Print preview</button>`;
  const draft = boot.draft || {};
  Object.keys(draft).forEach(key => {
    const el = document.querySelector(`[name="${key}"]`);
    if (!el) return;
    if (el.type === "checkbox") el.checked = !!draft[key];
    else el.value = draft[key];
  });
  $("fields").addEventListener("input", onChange);
  $("fields").addEventListener("change", onChange);
  $("submit").onclick = submitDoc;
  $("pdf").onclick = downloadPdf;
  $("print").onclick = () => window.print();
  renderPreview();
}
let saveTimer;
function onChange() {
  renderPreview();
  $("status").textContent = "Saving draft…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 800);
}
async function saveDraft() {
  try {
    await fetch("/api/draft", {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token: TOKEN, kind: kind(), form: formData()})});
    $("status").textContent = "Draft saved";
  } catch { $("status").textContent = "Draft not saved (offline)"; }
}
async function submitDoc() {
  $("err").textContent = "";
  $("status").textContent = "Submitting…";
  const res = await fetch("/api/submit", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token: TOKEN, kind: kind(), form: formData()})});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $("err").textContent = data.error || "Submit failed"; $("status").textContent = "Error"; return; }
  $("status").textContent = "Filed #" + data.case_number;
  $("err").className = "ok";
  $("err").textContent = "Saved, PDF posted to Discord for review. Case #" + data.case_number;
}
async function downloadPdf() {
  const res = await fetch("/api/preview.pdf", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token: TOKEN, kind: kind(), form: formData()})});
  if (!res.ok) { $("err").textContent = "Could not build PDF"; return; }
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (kind() + ".pdf");
  a.click();
}
async function start() {
  $("kind").innerHTML = KINDS.map(k => `<option value="${k.id}">${k.label}</option>`).join("");
  if (LOCKED && LOCKED !== "editor") { $("kind").value = LOCKED; $("kind").disabled = true; }
  else $("kind").value = "citation";
  $("kind").onchange = paintFields;
  paintFields();
  $("status").textContent = "Loading names…";
  try {
    const res = await fetch("/api/bootstrap?token=" + encodeURIComponent(TOKEN), {signal: AbortSignal.timeout(8000)});
    boot = await res.json();
    if (boot.error) throw new Error(boot.error);
  } catch (e) {
    $("status").textContent = e.message || "Editor ready (names unavailable)";
    return;
  }
  if (boot.draft && boot.draft.kind && !$("kind").disabled) $("kind").value = boot.draft.kind;
  paintFields();
  $("status").textContent = "Subject: " + (boot.subject || "unknown");
}
start();
</script>
</body>
</html>
